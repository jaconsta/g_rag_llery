  ## Third-party dependencies
  db:
    # Note!: Change this for x64 cpus from `arm64` to `amd64` (ie. pg18-amd64)
    image: docker.io/timescale/timescaledb-ha:pg18-arm64
    ports:
      - 7654:5432
    env_file:
      - db.env
    # volumes:
    #   - ./postgres-data:/var/lib/postgresql/data
    networks:
      - gallery_net
  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.9.7 
    ports:
      - 2181:2181
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - gallery_net
  kafka:
    image: docker.io/confluentinc/cp-kafka:7.9.7
    ports:
      - 9092:9092
      - 29092:29092
    env_file: kafka.env
    depends_on:
      - zookeeper
    networks:
      - gallery_net
networks:
  gallery_net:
    name: gallery_net
    driver: bridge

