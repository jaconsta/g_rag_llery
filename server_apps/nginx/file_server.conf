server {
    listen 80 default_server;
    server_name _;

    # Directory where files will be stored
    root /data/files;

    # Optional: allow directory listing in browser
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    client_max_body_size 100M;

    location /upload/ {
        alias /data/files/incoming/;

        # Enable WebDAV methods
        dav_methods PUT DELETE MKCOL COPY MOVE;
        # dav_ext_methods PROPFIND OPTIONS;

        # Automatically create directories for PUT uploads
        create_full_put_path on;

        # File permissions for uploaded files
        dav_access user:rw group:rw all:r;

        # Allow browser viewing/listing
        autoindex on;

        # Upload temp location
        client_body_temp_path /tmp/nginx-upload-temp;

        # Optional but useful
        client_body_buffer_size 128k;

        # CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:5173" always;
            add_header Access-Control-Allow-Methods "GET, PUT, DELETE, OPTIONS, MKCOL, COPY, MOVE" always;
            add_header Access-Control-Allow-Headers "Content-Type, Content-Length, Authorization, Range" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # CORS for actual requests
        add_header Access-Control-Allow-Origin "http://localhost:5173" always;
        add_header Access-Control-Allow-Methods "GET, PUT, DELETE, OPTIONS, MKCOL, COPY, MOVE" always;
        add_header Access-Control-Allow-Headers "Content-Type, Content-Length, Authorization, Range" always;
    }
}

